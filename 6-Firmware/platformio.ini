; PlatformIO Project Configuration File
; Target: ESP32-S3FN8 — 8 MB flash Quad-SPI integrata, SENZA PSRAM

; Password OTA: unica sorgente, usata dal firmware e dal caricamento via WiFi. Cambiarla qui.
[ota]
password = calibra-ota

[env:esp32-s3fn8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Flash: 8 MB Quad-SPI @ 80 MHz ---
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; --- Partition table personalizzata: due slot app per l'OTA ---
board_build.partitions = partitions.csv

; --- Interfaccia web (cartella data/) su LittleFS nella partizione "spiffs" ---
;     caricamento: pio run -t uploadfs   (via WiFi: pio run -e esp32-s3fn8-ota -t uploadfs)
board_build.filesystem = littlefs

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DOTA_PASSWORD=\"${ota.password}\"

build_src_flags =
    -Wall
    -Wextra

lib_deps =
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer

; Caricamento via WiFi: PC collegato all'AP "IO-Tester" → pio run -e esp32-s3fn8-ota -t upload
[env:esp32-s3fn8-ota]
extends = env:esp32-s3fn8
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=${ota.password}
