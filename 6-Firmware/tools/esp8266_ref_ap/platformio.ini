; Scheda ESP8266 di riferimento per il confronto antenna (non fa parte del firmware del calibratore).
; board: nodemcuv2 va bene per NodeMCU e per moduli ESP-12E/F generici (anche Wemos D1 mini).

[env:esp8266_ref]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
